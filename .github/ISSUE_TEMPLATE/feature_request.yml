name: Feature request
description: Something Lookout could show or do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like Lookout to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: What you do today instead
      description: How you find out or get there now, and where it falls short.
  - type: input
    id: agents
    attributes:
      label: Agents involved
      description: Claude Code, Codex, Copilot, several, or any.
