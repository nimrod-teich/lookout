<!doctype html>
<!-- Dev preview of the board outside VS Code: npm run build, then open this file. ?fixture=agents shows three agents; ?markers=auto|always|never as the setting; &fold=favourites,done folds those groups; &park=<ids>&parkedOpen=1 parks sessions and opens Parked; &sort=name|project|recent|custom orders the groups; &group=project|branch|model|agent|window makes the sections. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme-dark.css" id="theme">
<link rel="stylesheet" href="../media/board.css">
<style>html { background: var(--vscode-sideBar-background); } body { width: 300px; }</style>
</head>
<body>
<div id="root"></div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "light") {
    document.getElementById("theme").href = "theme-light.css";
    document.body.className = "vscode-light";
  } else {
    document.body.className = "vscode-dark";
  }
  if (params.get("motion") === "0") document.body.classList.add("vscode-reduce-motion");
  // Fake answers for the search box: project: and branch: pick sessions; of those, every other one matches the
  // words, with them planted in a snippet; operators alone list what they pick, without matches.
  const fakeSearch = (query, sessions) => {
    const words = query.trim().split(/\s+/).filter(Boolean);
    const ops = words.filter((w) => /^(since|before|project|branch|file):./i.test(w));
    const text = words.filter((w) => !ops.includes(w)).join(" ");
    const picked = sessions.filter((s) => ops.every((op) => {
      const key = op.slice(0, op.indexOf(":")).toLowerCase();
      const value = op.slice(op.indexOf(":") + 1).toLowerCase();
      if (key === "project") return `${s.project} ${s.worktree ?? ""}`.toLowerCase().includes(value);
      if (key === "branch") return (s.branch ?? "").toLowerCase().includes(value);
      return true;
    }));
    if (text === "") return picked.map((s) => ({ id: s.id, count: 0, hits: [] }));
    return picked.filter((s, i) => i % 2 === 0).map((s, i) => {
      const you = `…can we retry the ${text} when Stripe answers 500, and keep the invoice ids? The ${s.project} handler drops them today…`;
      const agent = `…the ${text} handler now retries three times with backoff and logs the event id; the ${s.project} tests cover the 500 and the timeout…`;
      const mark = (line) => { const at = line.toLowerCase().indexOf(text.toLowerCase()); return at < 0 ? [] : [[at, at + text.length]]; };
      return { id: s.id, count: 2 + i * 3, hits: [{ role: "you", snippet: you, ranges: mark(you) }, { role: "agent", snippet: agent, ranges: mark(agent) }] };
    });
  };
  /** Posts the fixture; the scope "folders" lists only the past sessions the agent resumes here. */
  let post = () => {};
  let favouriteIds = [];
  /** The archived sessions' ids, newest first: &archived=2 archives the fixture's first two earlier sessions. */
  let archiveIds = [];
  let earlierScope = "folders";
  /** As the extension keeps it: &sort=name|project|recent|custom; a drag makes it "custom". */
  let sort = { by: params.get("sort") ?? "time", order: [] };
  /** As the extension keeps it: &group=project|branch|model|agent|window. */
  let groupBy = params.get("group") ?? "state";
  let fixtureSessions = [];
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => {
      console.log("to extension:", JSON.stringify(m));
      if (m.type === "search") setTimeout(() => window.postMessage({ type: "search", query: m.query, results: fakeSearch(m.query, fixtureSessions), pending: 0 }, "*"), 100);
      if (m.type === "earlierScope") post(m.scope);
      if (m.type === "order") {
        sort = { by: "custom", order: m.ids };
        post(earlierScope);
      }
      if (m.type === "group") {
        groupBy = m.by;
        post(earlierScope);
      }
      if (m.type === "sort") {
        sort = { ...sort, by: m.by };
        post(earlierScope);
      }
      if (m.type === "favouriteOrder") {
        favouriteIds = m.ids;
        post(earlierScope);
      }
      if (m.type === "favourite") {
        favouriteIds = favouriteIds.includes(m.id) ? favouriteIds.filter((id) => id !== m.id) : [m.id, ...favouriteIds];
        post(earlierScope);
      }
      if (m.type === "archive") {
        if (archiveIds.includes(m.id)) archiveIds = archiveIds.filter((id) => id !== m.id);
        else {
          archiveIds = [m.id, ...archiveIds];
          favouriteIds = favouriteIds.filter((id) => id !== m.id);
        }
        post(earlierScope);
      }
    },
    getState: () => ({ hidden: (params.get("hide") ?? "").split(",").filter(Boolean), folded: (params.get("fold") ?? "").split(",").filter(Boolean), parked: params.get("parkedOpen") === "1", earlier: params.get("earlier") === "1", archive: params.get("archiveOpen") === "1", agents: (params.get("hideAgents") ?? "").split(",").filter(Boolean) }),
    setState: () => {},
  });
  window.addEventListener("load", async () => {
    const fixture = await (await fetch(`fixtures/${params.get("fixture") ?? "busy"}.json`)).json();
    const now = Date.now();
    // Times below 1e9 are "this many ms ago".
    const ago = (t) => (typeof t === "number" && t < 1e9 ? now - t : t);
    // &park=a,b: those sessions are parked, as the extension marks them.
    const parkIds = (params.get("park") ?? "").split(",").filter(Boolean);
    for (const s of fixture.sessions) {
      if (parkIds.includes(s.id)) {
        s.parked = true;
        if (s.state === "done") s.state = "idle";
      }
      s.since = ago(s.since);
      s.lastWriteAt = ago(s.lastWriteAt);
      if (s.evidence) s.evidence.at = ago(s.evidence.at);
    }
    // One agent's usage, or one group per agent.
    const usage = fixture.usage;
    for (const group of Array.isArray(usage) ? usage : usage ? [usage] : []) {
      if (group.fetchedAt !== undefined) group.fetchedAt = now - group.fetchedAt;
      for (const m of group.meters) if (m.resetsAt) m.resetsAt = now + m.resetsAt;
    }
    // As lookout.agentMarkers: auto shows them once the board shows two or more agents, running, earlier or in the usage.
    const markersSetting = params.get("markers") ?? "auto";
    const onBoard = [...fixture.sessions, ...(fixture.past ?? []), ...(Array.isArray(usage) ? usage : usage ? [usage] : []).filter((g) => g.meters.length > 0)];
    const markers = markersSetting === "always" || (markersSetting === "auto" && new Set(onBoard.map((s) => s.agent ?? "claude-code")).size >= 2);
    for (const p of fixture.past ?? []) if (p.modifiedAt < 1e12) p.modifiedAt = now - p.modifiedAt;
    // &many=57: that many earlier sessions, copies of the fixture's an hour apart, to page through.
    const many = Number(params.get("many") ?? 0);
    const base = fixture.past ?? [];
    for (let i = 0; base.length && fixture.past.length < many; i++) {
      const from = base[i % base.length];
      fixture.past.push({ ...from, id: `${from.id}-${i}`, title: `${from.title} (${i + 1})`, modifiedAt: from.modifiedAt - (i + 1) * 3600_000 });
    }
    const earlier = { scope: "folders", limit: 500, capped: false, ...fixture.earlier };
    if (params.get("scope")) earlier.scope = params.get("scope");
    if (params.get("capped") === "1") earlier.capped = true;
    favouriteIds = fixture.favourites ?? [];
    archiveIds = (fixture.past ?? []).slice(0, Number(params.get("archived") ?? 0)).map((p) => p.id);
    favouriteIds = favouriteIds.filter((id) => !archiveIds.includes(id));
    post = (scope) => {
      earlierScope = scope;
      earlier.scope = scope;
      // As the extension sends them: newest first.
      const past = (fixture.past ?? []).filter((p) => (scope === "all" || p.resumable !== false) && !archiveIds.includes(p.id)).sort((a, b) => b.modifiedAt - a.modifiedAt);
      const archive = archiveIds.map((id) => (fixture.past ?? []).find((p) => p.id === id)).filter(Boolean);
      fixtureSessions = [...fixture.sessions, ...past, ...archive];
      // Starred sessions that are not running and that the scope does not list come along.
      const favourites = { ids: favouriteIds, past: (fixture.past ?? []).filter((p) => favouriteIds.includes(p.id) && !past.includes(p)) };
      window.postMessage({ type: "sessions", sessions: fixture.sessions, past, now, usage, markers, earlier: { ...earlier }, favourites, archive, sort, group: groupBy }, "*");
    };
    post(earlier.scope);
    const q = params.get("q");
    if (q) setTimeout(() => { const input = document.querySelector(".search input"); input.value = q; input.dispatchEvent(new Event("input")); }, 200);
    const hoverId = params.get("hover");
    if (hoverId) setTimeout(() => { const boats = [...document.querySelectorAll(".boat")]; const i = fixture.sessions.findIndex((s) => s.id === hoverId); boats[i]?.dispatchEvent(new MouseEvent("mouseenter")); }, 300);
  });
</script>
<script src="../dist/board.js"></script>
</body>
</html>
