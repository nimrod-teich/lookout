<!doctype html>
<!-- Dev preview of the note page outside VS Code: npm run build, then open this file. ?empty=1 for no note yet, &agent=codex&markers=1, &theme=light -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme-dark.css" id="theme">
<link rel="stylesheet" href="../media/note.css">
<style>html { background: var(--vscode-editor-background); }</style>
</head>
<body>
<div id="root"></div>
<script>
  const params = new URLSearchParams(location.search);
  if (params.get("theme") === "light") {
    document.getElementById("theme").href = "theme-light.css";
    document.body.className = "vscode-light";
  } else {
    document.body.className = "vscode-dark";
  }
  window.acquireVsCodeApi = () => ({
    postMessage: (m) => {
      console.log("to extension:", JSON.stringify(m));
      if (m.type === "save") setTimeout(() => window.postMessage({ type: "saved", id: m.id, note: m.text.trim() || undefined, noteAt: Date.now() }, "*"), 150);
      if (m.type === "remove") setTimeout(() => window.postMessage({ type: "saved", id: m.id, note: undefined }, "*"), 150);
    },
  });
  const note = params.get("empty") === "1" ? undefined : "Kept for the webhook signature fix: the raw-body parser is scoped to /billing/webhook and every other route keeps the JSON parser.\n\nStill to do from this session:\n- the checkout-sync fallback needs a test for a late checkout.session.completed\n- ask about moving the tax_id_collection gate to the config\n\nThe smoke passed on 2026-10-26 (14 routes).";
  const view = { type: "note", session: { id: "1", title: "Migrate billing webhooks", where: "api · ⎇ billing-webhooks", agent: params.get("agent") ?? "claude-code", live: params.get("live") !== "0" }, note, noteAt: note ? Date.now() - 35 * 60_000 : undefined, max: 8000, markers: params.get("markers") === "1" };
  window.addEventListener("load", () => window.postMessage(view, "*"));
</script>
<script src="../dist/note.js"></script>
</body>
</html>
